<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Motion with no reduced-motion rule</title>
  <style>
    body { margin: 0; padding: 32px; font: 18px/1.4 sans-serif; }
    .dot { width: 24px; height: 24px; border-radius: 12px; background: #e11d48; animation: spin 2s linear infinite; }
    @keyframes spin { to { rotate: 360deg; } }
  </style>
</head>
<body>
  <div class="dot" id="dot"></div>
</body>
</html>
