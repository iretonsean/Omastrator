<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fixture shop</title>
<style>
  body { margin: 0; background: #ffffff; color: #1f2937; font-family: sans-serif; font-size: 16px; line-height: 24px; }
  header { padding: 24px; background: #111827; color: #f9fafb; }
  h1 { font-size: 36px; line-height: 40px; font-weight: 700; margin: 0 0 16px; }
  .card { padding: 16px; margin: 8px; border-radius: 12px; background: #f3f4f6; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 200px; }
  .button { display: inline-block; padding: 8px 16px; border-radius: 6px; background: #2563eb; color: #ffffff; font-size: 14px; font-weight: 600; }
  p { margin: 0 0 8px; }
</style>
</head>
<body>
<header><h1>Shop</h1></header>
<div class="card"><p>First</p><span class="button">Buy</span></div>
<div class="card"><p>Second</p><span class="button">Buy</span></div>
<div class="card"><p>Third</p><span class="button">Buy</span></div>
<div class="card"><p>Fourth</p><span class="button">Buy</span></div>
</body>
</html>
