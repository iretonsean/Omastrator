# Build and test on every push and pull request. Same Arch container as release.yml's x86_64
# job, so a dependency change fails here before it fails a tagged release build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and test dependencies
        run: pacman -Syu --noconfirm --needed cmake qt6-base qt6-declarative git jq chromium

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DOMASTRATOR_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
