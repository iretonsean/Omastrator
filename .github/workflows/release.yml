# On a v* tag: build x86_64 and aarch64, test offscreen, and attach a /usr tree tarball for
# each arch plus a combined SHA256SUMS.txt to a GitHub Release. See docs/RELEASING.md.
#
# Built in Arch Linux containers, not a generic Ubuntu image: Omastrator only supports Arch/
# Omarchy (AGENTS.md), so building where it runs means the same rolling-release Qt and glibc
# the binary will run against, with no version to pin or cross-version ABI to reason about.
# There is no official Arch container for aarch64 (the x86_64 one runs under QEMU instead,
# which is why the aarch64 job below uses a native arm64 runner with an Arch Linux ARM image
# rather than emulating x86_64's). Nothing here uses Qt's private API (checked with a grep for
# `private/` Qt headers), so this isn't building against a Qt version chosen to dodge that.
name: Release

on:
  push:
    tags:
      - "v*"
  # For proving a full run before the first real tag. It builds and uploads artifacts under
  # the branch's name, but publishes nothing: the release job only runs for a v* tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            # archlinux:base-devel, pinned by digest; docs/RELEASING.md says how to bump it.
            image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
          # No official Arch Linux ARM container is published for GitHub's arm64 runners, so
          # this uses a community image (menci/archlinuxarm:base-devel, one person's Docker Hub
          # account), pinned by digest so a moved tag can't change what builds the binaries.
          # Worth a first-run check: docs/RELEASING.md.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm@sha256:d939db4a839a146fe49bbde51e4d8d0453bca4a07e96d795ee8f2ee6a56a6943
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      # A container's PID 1 doesn't reap orphans, so processes the tests stop linger as zombies.
      options: --init
    steps:
      # Chromium isn't installed: its sandbox can't start in a container, and the Chromium
      # tests skip without it. Every step after checkout runs as `builder`, because the suite
      # assumes a normal user (root reads the mode-000 files its tests expect to be
      # unreadable) and its git tests need an identity. The image has no fonts at all, and
      # the type tests measure real glyphs, so it gets DejaVu (fontconfig's default sans).
      - name: Install build and test dependencies
        run: |
          # The aarch64 runner's container can't apply pacman 7's download sandbox (Landlock, the alpm user):
          # "switching to sandbox user 'alpm' failed!". Downloads run unsandboxed there; packages are still signed.
          if [ "$(uname -m)" = aarch64 ]; then
            sed -i 's/^DownloadUser/#DownloadUser/' /etc/pacman.conf
            grep -q '^DisableSandbox' /etc/pacman.conf || sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          fi
          pacman -Syu --noconfirm --needed cmake qt6-base qt6-declarative git jq ttf-dejavu
          useradd -m builder

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version//\//-}" >> "$GITHUB_OUTPUT"

      - name: Hand the workspace to the build user
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder git config --global user.name CI
          runuser -u builder -- env HOME=/home/builder git config --global user.email ci@example.invalid

      # The shipped binary is built without the tests, with LTO (about 23% smaller), and stripped.
      - name: Configure
        run: runuser -u builder -- env HOME=/home/builder cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DOMASTRATOR_BUILD_TESTS=OFF -DOMASTRATOR_LTO=ON

      - name: Build
        run: runuser -u builder -- env HOME=/home/builder cmake --build build -j"$(nproc)"

      # The tests build in their own tree (no LTO), so a tag still runs the whole suite on both
      # architectures; CI runs the same suite on every push.
      - name: Test (offscreen; each test already sets QT_QPA_PLATFORM itself)
        run: |
          runuser -u builder -- env HOME=/home/builder cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release
          runuser -u builder -- env HOME=/home/builder cmake --build build-tests -j"$(nproc)"
          runuser -u builder -- env HOME=/home/builder ctest --test-dir build-tests --output-on-failure --timeout 300

      - name: Install to a /usr tree
        run: runuser -u builder -- env HOME=/home/builder DESTDIR="$PWD/pkgroot" cmake --install build --strip

      # The tag-derived version goes through the environment, not into the script text: a tag
      # name can hold shell metacharacters.
      - name: Tar it up
        working-directory: pkgroot
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        # root:root ownership, so the package doesn't carry the build user's uid.
        run: tar --zstd --owner=0 --group=0 -cf "../omastrator-$VERSION-$ARCH.tar.zst" usr

      - uses: actions/upload-artifact@v4
        with:
          name: omastrator-${{ matrix.arch }}
          path: omastrator-*-${{ matrix.arch }}.tar.zst
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.tar.zst > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes artifacts/*.tar.zst artifacts/SHA256SUMS.txt
